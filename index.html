<html lang="ja">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期待値ラボ</title>

<style>
  html,body{margin:0;height:100%;}
  body{background:#0B0B10;color:#A6ADBF;
    font-family:'Hiragino Sans','Yu Gothic Medium','Noto Sans JP',Meiryo,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;}
  a{color:#E8C879;}
</style>
</head>
<body>
  <p>期待値ラボへ移動しています…<br>
     自動で切り替わらない場合は <a href="./ev-lab.html">こちらから開いてください</a>。</p>
  <script>location.replace('./ev-lab.html');</script>
</body>
</html>
